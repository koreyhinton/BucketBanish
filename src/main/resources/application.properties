spring.application.name=bucketbanish
# Local-only by default: the API can read anything the configured credentials can.
server.address=127.0.0.1
server.port=8080

# Connection details (endpoint, region, keys) live in a gitignored file in the directory you start
# the app from. Copy bucketbanish.local.properties.example to bucketbanish.local.properties.
spring.config.import=optional:file:./bucketbanish.local.properties

bucketbanish.threads=16
